version: '3.8'

services:
  quinns-letter-sounds:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quinns-letter-sounds
    restart: unless-stopped
    ports:
      - "${PORT:-3002}:${PORT:-3002}"
    environment:
      - PORT=${PORT:-3002}
      - NODE_ENV=production
      - DB_DIR=/app/data
    volumes:
      - ./data:/app/data
